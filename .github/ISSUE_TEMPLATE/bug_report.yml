name: Bug report
description: Something in HerdrDesk does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private data (real terminal output, team names, hostnames, paths, tokens) from everything you paste. For security problems, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open HerdrDesk with ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HerdrDesk commit or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, Mac model, Herdr Core version
      placeholder: macOS 15.2, M3 MacBook Air, hc 0.1.21
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Redact private data first.
