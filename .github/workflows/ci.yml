name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Swift version
        run: swift --version
      - name: Web UI tests
        run: node --test Tests/*.test.mjs
      - name: Swift tests
        run: swift test
      - name: Build the app
        run: ./scripts/build.sh
