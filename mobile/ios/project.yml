name: HerdrMobile
options:
  bundleIdPrefix: dev.herdr.mobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MobileCore:
    type: framework
    platform: iOS
    sources: [Sources/MobileCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.mobile.firstslice.core
  HerdrMobile:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Herdr
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: MobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.mobile.firstslice
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        INFOPLIST_KEY_CFBundleDisplayName: Herdr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  MobileCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/MobileCoreTests]
    dependencies:
      - target: MobileCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
schemes:
  HerdrMobile:
    build:
      targets:
        HerdrMobile: all
        MobileCoreTests: [test]
    test:
      targets: [MobileCoreTests]
